name: Supabase db push

# Applies pending files in supabase/migrations to the linked project.
# MANUAL ONLY (workflow_dispatch): it never runs on push or pull_request.
# Applying (dry_run = false) is refused unless the workflow is run from main;
# a dry run may be run from any branch.
#
# Setup steps: docs/db-push.md
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — Personal or CI token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD    — Database password for the project
# Optional:
#   SUPABASE_PROJECT_ID     — defaults to nzjwhmqrsxztnpdppbub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print pending migrations only (no apply)"
        type: boolean
        default: false
      project_id:
        description: "Override project ref"
        type: string
        required: false

permissions:
  contents: read

# One production apply at a time, regardless of which ref started it.
concurrency:
  group: supabase-db-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ inputs.project_id || secrets.SUPABASE_PROJECT_ID || 'nzjwhmqrsxztnpdppbub' }}
    steps:
      - name: Refuse to apply from a non-main ref
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Applying migrations to production is only allowed from main (ref: $GITHUB_REF). Re-run from main, or set dry_run = true."
          exit 1

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Require secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing secret SUPABASE_DB_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add the secrets, then re-run this workflow. Steps:"
            echo "1. Create a token at https://supabase.com/dashboard/account/tokens"
            echo "2. Copy the database password from Project Settings → Database"
            echo "3. Repo Settings → Secrets and variables → Actions:"
            echo "     SUPABASE_ACCESS_TOKEN"
            echo "     SUPABASE_DB_PASSWORD"
            echo "4. Actions → Supabase db push → Run workflow (dry_run first)"
            echo "Full guide: docs/db-push.md"
            exit 1
          fi
          echo "Project $PROJECT_ID"

      - name: Link project
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: List remote vs local
        run: supabase migration list

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: supabase db push --dry-run --yes

      - name: Apply pending migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase db push --yes

      - name: Confirm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase migration list
