name: Supabase db push

# Applies pending files in supabase/migrations to the linked project.
# Does not run on pull requests or preview branches.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — Personal or CI token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD    — Database password for the project
# Optional:
#   SUPABASE_PROJECT_ID     — defaults to nzjwhmqrsxztnpdppbub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print pending migrations only (no apply)"
        type: boolean
        default: false
      project_id:
        description: "Override project ref"
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-push.yml"

concurrency:
  group: supabase-db-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ inputs.project_id || secrets.SUPABASE_PROJECT_ID || 'nzjwhmqrsxztnpdppbub' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing secret SUPABASE_DB_PASSWORD" >&2
            exit 1
          fi
          echo "Project $PROJECT_ID"

      - name: Link project
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: List remote vs local
        run: supabase migration list

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: supabase db push --dry-run --yes

      - name: Apply pending migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase db push --yes

      - name: Confirm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: supabase migration list
